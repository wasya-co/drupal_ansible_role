server {
  listen 443 ssl;
  server_name {{ site.subdomain }}.{{ site.domain }} ;
  proxy_read_timeout 3600;

  location / {
    proxy_pass http://127.0.0.1:{{ host_http_port }}/;
  }

  include /etc/nginx/conf.d/proxy_headers.conf ;
  ssl_certificate /opt/tmp/fullchain.pem; # managed by Certbot
  ssl_certificate_key /opt/tmp/privkey.pem; # managed by Certbot

}